<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundo Enabley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: céu em tela cheia com uma ilha-diorama 3D; HUD flutuante no topo, doca de chips na base, painel-cartão à direita (folha inferior no celular).
   Visual de um único mundo diurno (estilo animação 3D), por escolha: as cores são fixas e não seguem o tema escuro. */
:root{
  --sky-1:#4C82D6; --sky-2:#93C5F0; --sky-3:#E6F3FB;
  --ink:#24164F; --muted:#5D5583; --card:#FFFFFF; --line:#E9E3F6; --soft:#F5F1FD;
  --purple:#4B2BA8; --magenta:#A0208F; --gold:#F2B841; --blue:#0066FF;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --chunk:0 4px 0 rgba(36,22,79,.14),0 12px 26px rgba(36,22,79,.18);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 52%,var(--sky-3) 100%);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none !important}
#scene{position:fixed;inset:0}
#scene canvas{display:block;touch-action:none}

/* HUD */
.hud{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 16px);z-index:5;pointer-events:none;max-width:min(460px,calc(100vw - 36px))}
.brand{display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:7px 16px 7px 12px;box-shadow:var(--chunk);animation:pop .8s var(--spring) both .1s}
.brand img{height:30px;width:auto;display:block}
.brand .wm{font:700 24px/1 var(--f-display);color:var(--magenta)}
.brand small{font:600 11px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-left:2px solid var(--line);padding-left:10px}
.hud h1{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,6.4vw,78px);line-height:.92;margin:.2em 0 0;color:#fff;letter-spacing:-.01em;text-wrap:balance;
  text-shadow:0 3px 0 #3A2590,0 6px 0 rgba(36,22,79,.45),0 18px 34px rgba(36,22,79,.35)}
.hud h1 span{display:inline-block;animation:drop .9s var(--spring) both}
.hud p{color:#fff;font-weight:500;text-shadow:0 1px 10px rgba(36,22,79,.55);font-size:15px;line-height:1.45;max-width:38ch;margin:.55em 0 0;animation:fadeUp .7s ease both 1s}
@keyframes drop{0%{transform:translateY(-80px) scale(.6,1.4);opacity:0}55%{transform:translateY(6px) scale(1.15,.82);opacity:1}100%{transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeUp{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}

.tools{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 18px);display:flex;gap:10px;z-index:6}
.btn{border:0;border-radius:999px;padding:10px 18px;font:600 15px/1 var(--f-display);letter-spacing:.01em;cursor:pointer;background:var(--gold);color:var(--ink);
  box-shadow:0 5px 0 #C98A10,0 12px 22px rgba(36,22,79,.25);transition:transform .35s var(--spring),box-shadow .2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px) scale(1.05)}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #C98A10,0 4px 10px rgba(36,22,79,.25)}
.btn.ghost{background:var(--card);box-shadow:0 5px 0 #D4CBEA,0 12px 22px rgba(36,22,79,.2)}
.btn.ghost:active{box-shadow:0 1px 0 #D4CBEA}
.btn .ico{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.btn.playing .ico{width:10px;height:12px;border:0;border-left:3px solid currentColor;border-right:3px solid currentColor}

/* labels 3D */
.labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.lbl .lb{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:var(--card);border-radius:999px;padding:5px 12px;font:600 14px/1.1 var(--f-display);color:var(--ink);
  box-shadow:0 3px 0 rgba(36,22,79,.16),0 8px 18px rgba(36,22,79,.22);transform-origin:50% 120%;transition:transform .5s var(--spring),opacity .18s;cursor:pointer;pointer-events:auto;position:relative}
.lbl .lb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--card)}
.lbl .lb i{width:10px;height:10px;border-radius:50%;background:var(--c,#999);flex:0 0 auto}
.lbl.big .lb{font-size:18px;padding:7px 15px;border:3px solid var(--c)}
.lbl.big .lb::after{bottom:-9px}
.lbl.big .lb small{font:500 12px var(--f-body);color:var(--muted)}
.lbl.case .lb b{color:var(--c);font-size:17px;font-weight:700}
.lbl.person .lb{font-size:13px;padding:4px 10px}
.lbl.hide .lb{transform:scale(.2) translateY(20px);opacity:0;pointer-events:none}
.lbl.sel .lb{background:var(--ink);color:#fff;transform:scale(1.12)}
.lbl.sel .lb::after{border-top-color:var(--ink)}
.lbl.sel .lb small{color:#CFC6F0}
.lbl .lb:hover{transform:scale(1.1)}
@media (max-width:640px){ .lbl.sm{display:none} .lbl.big .lb{font-size:15px;padding:5px 11px} .lbl.big .lb small{display:none} }

/* doca */
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;display:flex;gap:9px;overflow-x:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--card);border:0;border-radius:999px;padding:9px 15px;cursor:pointer;font:600 14.5px/1 var(--f-display);color:var(--ink);
  box-shadow:0 4px 0 #D4CBEA,0 10px 20px rgba(36,22,79,.18);transition:transform .4s var(--spring),background .2s,color .2s}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c,#999);flex:0 0 auto;transition:transform .4s var(--spring)}
.chip:hover{transform:translateY(-3px) scale(1.06)}
.chip:hover i{transform:scale(1.5)}
.chip:active{transform:translateY(3px) scale(.96)}
.chip.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #120A30,0 10px 20px rgba(36,22,79,.3)}
.hint{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);font:500 13px var(--f-body);color:#fff;text-shadow:0 1px 6px rgba(36,22,79,.6);z-index:5;pointer-events:none}

/* número em destaque */
#story{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center;width:min(620px,calc(100vw - 40px));opacity:0;transition:opacity .25s}
#story.on{opacity:1}
#story b{display:block;font:700 clamp(54px,9vw,104px)/.9 var(--f-display);color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:0 3px 0 var(--sc,#4B2BA8),0 6px 0 var(--sc,#4B2BA8),0 9px 0 rgba(36,22,79,.35),0 22px 40px rgba(36,22,79,.35)}
#story span{display:inline-block;margin-top:10px;font:600 15px/1.35 var(--f-body);color:var(--ink);background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;box-shadow:var(--chunk)}
#story.on b{animation:storyPop .8s var(--spring) both}
#story.on span{animation:fadeUp .5s ease both .15s}
@keyframes storyPop{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:none}}
@media (min-width:900px){ body.panel-open #story{left:calc(50% - 210px)} }
@media (max-width:640px){ #story{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 168px)} body.panel-open #story{opacity:0} .hint{display:none} }

/* painel */
aside#panel{position:fixed;z-index:10;right:calc(16px + env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);
  width:min(410px,calc(100vw - 32px));background:var(--card);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 8px 0 rgba(36,22,79,.12),0 30px 60px rgba(36,22,79,.3);transform:translateX(calc(100% + 60px)) rotate(4deg);transition:transform .7s var(--spring)}
aside#panel.open{transform:none}
@media (max-width:640px){ aside#panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-height:62vh;transform:translateY(calc(100% + 80px))} }
.ph{padding:18px 22px 16px;background:var(--pc,#4B2BA8);color:#fff;position:relative;flex:0 0 auto}
.ph::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:radial-gradient(circle at 10px 0,var(--pc,#4B2BA8) 10px,transparent 10.5px) 0 0/20px 14px repeat-x}
.ph .kind{margin:0 0 4px;font:600 12px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:.85;padding-right:44px}
.ph h2{margin:0;font:700 32px/1 var(--f-display);padding-right:44px;text-wrap:balance}
.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;cursor:pointer;font:600 22px/1 var(--f-display);transition:transform .4s var(--spring)}
.close:hover{transform:rotate(90deg) scale(1.1)}
.pb{overflow:auto;padding:24px 22px 26px;flex:1;font-size:14.5px;line-height:1.5}
.pb h3{font:700 19px/1.15 var(--f-display);margin:22px 0 10px;color:var(--ink)}
.pb h3:first-child{margin-top:0}
.pb p{margin:0 0 10px;color:var(--ink)}
.pb .lead{font-size:15.5px}
.pb .muted{color:var(--muted)}
.ls{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ls li{position:relative;padding-left:22px}
.ls li::before{content:"";position:absolute;left:3px;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--pc,#4B2BA8)}
.feat{display:grid;gap:9px}
.feat div{background:var(--soft);border-radius:16px;padding:11px 14px}
.feat b{display:block;font:600 16px/1.2 var(--f-display);margin-bottom:3px}
.feat em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px}
.feat em::before{content:"Dor: ";font-weight:600;color:var(--pc,#4B2BA8)}
.bigres{display:flex;align-items:baseline;gap:10px;background:var(--soft);border-radius:20px;padding:14px 16px;margin:4px 0 14px}
.bigres b{font:700 40px/1 var(--f-display);color:var(--pc,#4B2BA8);white-space:nowrap}
.bigres span{font-size:14px;line-height:1.35}
.quote{background:var(--soft);border-radius:20px 20px 20px 6px;padding:14px 16px;margin-top:14px;font-size:14px}
.quote cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.flow span{background:var(--soft);border-radius:999px;padding:6px 11px;font:600 13px/1.2 var(--f-display)}
.flow s{text-decoration:none;color:var(--pc,#4B2BA8);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tiles div{background:var(--soft);border-radius:18px;padding:12px 14px}
.tiles b{display:block;font:700 26px/1 var(--f-display);color:var(--pc,#4B2BA8)}
.tiles span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.go{display:flex;flex-wrap:wrap;gap:7px}
.go button{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;cursor:pointer;font:600 13.5px/1.1 var(--f-display);display:inline-flex;align-items:center;gap:7px;transition:transform .35s var(--spring),background .2s}
.go button i{width:9px;height:9px;border-radius:50%;background:var(--c,#999)}
.go button:hover{transform:scale(1.07);background:#EAE2FB}
.go button small{font:500 11.5px var(--f-body);color:var(--muted)}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.logos button{border:0;background:#fff;border-radius:14px;box-shadow:0 0 0 2px var(--line);padding:6px;cursor:pointer;transition:transform .35s var(--spring)}
.logos button:hover{transform:scale(1.08) rotate(-2deg)}
.logos img{display:block;width:100%;height:auto}
.logo-big{display:block;width:min(260px,100%);margin:0 auto 14px}
.partner{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.partner img{height:38px;width:auto}
.person{background:var(--soft);border-radius:18px;padding:12px 14px;margin-bottom:9px}
.person b{font:600 17px/1.15 var(--f-display);display:block}
.person .role{font-size:13px;color:var(--muted)}
.person .when{font-size:13px;margin-top:6px}
.contact{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.contact code{font:500 12.5px var(--f-body);background:#fff;border-radius:8px;padding:3px 8px;user-select:all;word-break:break-all}
.copy{border:0;background:var(--pc,#4B2BA8);color:#fff;border-radius:999px;padding:4px 10px;font:600 12px var(--f-display);cursor:pointer}
.steps{display:grid;gap:9px;counter-reset:st}
.steps div{background:var(--soft);border-radius:16px;padding:11px 14px 11px 48px;position:relative}
.steps div::before{counter-increment:st;content:counter(st);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--pc,#4B2BA8);color:#fff;font:700 15px/26px var(--f-display);text-align:center}
.steps b{font:600 16px/1.2 var(--f-display);display:block}
table.ex{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.ex td{padding:6px 0;border-bottom:1px solid var(--line)}
table.ex td:last-child{text-align:right;font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-80px);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font:600 14px var(--f-display);z-index:30;transition:transform .5s var(--spring)}
#toast.on{transform:translate(-50%,0)}
#fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font:600 18px var(--f-display);color:#fff}
@media (max-width:640px){
  .hud h1{font-size:40px} .hud p{font-size:13.5px;max-width:30ch}
  .tools{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);right:12px}
  .btn{padding:9px 14px;font-size:14px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important} }
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div class="labels" id="labels"></div>

<header class="hud">
  <div class="brand"><img id="brand-logo" alt="Enabley" hidden><span class="wm" id="brand-wm">enabley</span><small>Base comercial</small></div>
  <h1 id="title" aria-label="Mundo Enabley"></h1>
  <p>Treinamento, conhecimento e comunicação para quem trabalha longe de um computador. Clique em qualquer coisa: prédios, pessoas, balões e blocos.</p>
</header>
<div class="tools">
  <button class="btn" id="btn-tour" type="button"><span class="ico"></span><span id="tour-txt">Tour guiado</span></button>
  <button class="btn ghost" id="btn-index" type="button">Índice</button>
</div>

<div id="story" aria-live="polite"><b id="story-big"></b><span id="story-cap"></span></div>
<nav class="dock" id="dock" aria-label="Lugares do Mundo Enabley"></nav>
<div class="hint">Arraste para girar · role para aproximar · botão do meio move a câmera · clique em tudo</div>

<aside id="panel" aria-label="Detalhes">
  <div class="ph"><p class="kind" id="p-kind"></p><h2 id="p-title"></h2><button class="close" id="p-close" type="button" aria-label="Fechar painel">×</button></div>
  <div class="pb" id="p-body"></div>
</aside>
<div id="toast" role="status"></div>

<script src="assets/logos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

  x.drawImage(IMG_CLI, sx, sy, w, h, 0, 0, w, h);
  try{
    const im = x.getImageData(0,0,w,h), d = im.data;
    const bg = [d[0],d[1],d[2]];
    let x0=w, y0=h, x1=0, y1=0;
    for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ const i=(y*w+xx)*4, r=d[i], g=d[i+1], b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
      d[i] = Math.min(255, r*255/Math.max(200,bg[0])); d[i+1] = Math.min(255, g*255/Math.max(200,bg[1])); d[i+2] = Math.min(255, b*255/Math.max(200,bg[2]));
      if(mx-mn > 26 || mx < 212){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y; } }

}

const GC = {};
function rbox(w,h,d,r,m){
  m = m||3; const id = [w,h,d,r,m].join('|'); if(GC[id]) return GC[id];
  r = Math.min(r, w/2-.001, h/2-.001, d/2-.001); const N = 2*m+1;
  const g = new THREE.BoxGeometry(w,h,d,N,N,N), p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  const remap = (v, L)=>{ const i = Math.round((v + L/2)/(L/N)); let o; if(i<=m) o = r*(i/m); else o = L - r*((N-i)/m); return o - L/2; };
  const remapT = (t, L)=> (remap(t*L - L/2, L) + L/2)/L;
  const per = (N+1)*(N+1), dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  const v = new THREE.Vector3(), cc = new THREE.Vector3(), nn = new THREE.Vector3(), lim = new THREE.Vector3(w/2-r, h/2-r, d/2-r);
  for(let i=0;i<p.count;i++){
    v.set(remap(p.getX(i),w), remap(p.getY(i),h), remap(p.getZ(i),d));
    cc.set(Math.max(-lim.x,Math.min(lim.x,v.x)), Math.max(-lim.y,Math.min(lim.y,v.y)), Math.max(-lim.z,Math.min(lim.z,v.z)));
    nn.subVectors(v,cc); if(nn.lengthSq()<1e-9) nn.set(n.getX(i),n.getY(i),n.getZ(i)); nn.normalize();
    v.copy(cc).addScaledVector(nn, r); p.setXYZ(i, v.x, v.y, v.z); n.setXYZ(i, nn.x, nn.y, nn.z);
    const f = Math.floor(i/per), D = dims[f]; uv.setXY(i, remapT(uv.getX(i), D[0]), remapT(uv.getY(i), D[1]));
  }
  return (GC[id] = g);
}

function jelly(root){ return root.userData.j || (root.userData.j = { s:1, v:0, t:1, w:0, wv:0, p:1, pv:0, pt:1, base:root.scale.clone(), rz:root.rotation.z }); }

}

const sway = [];
(function(){
  const occ = [[0,2,13],[0,-11.5,5],[-7.5,11.5,6],[8.5,12.4,3.5]];
  PILLARS.forEach(p=>{ const q = polar(p.ang,19); occ.push([q.x,q.z,6]); });

  const greens = ['#4FB548','#6CC653','#3FA34D','#82D160'], trunk = toy('#9A6A45');
  let n = 0, tries = 0;
  while(n < 38 && tries < 900){ tries++;
    const a = rnd()*Math.PI*2, r = n < 26 ? 34 + rnd()*4.5 : 15.5 + rnd()*7.5, x = Math.cos(a)*r, z = Math.sin(a)*r;
    if((r > 24 && r < 27.5)) continue;
    if(occ.some(o=>Math.hypot(o[0]-x, o[1]-z) < o[2] + 1.6)) continue;

    g.add(mesh(geo.cyl(.22,.32,1.8,10), trunk, 0,.9,0));

  }
  const flowerC = ['#FF5C93','#F2B841','#FFFFFF','#A0208F'];
  for(let i=0;i<60;i++){ const a = rnd()*Math.PI*2, r = 15 + rnd()*24; if(r>23.8 && r<27.2) continue; const x = Math.cos(a)*r, z = Math.sin(a)*r; if(occ.some(o=>Math.hypot(o[0]-x,o[1]-z) < o[2])) continue;

})();

const clock = new THREE.Clock(); let T = 0;

  /* aba em segundo plano (quadros raros): conclui a entrada sem animar */
  if(raw > .3 && intros.length){ intros.forEach(it=>{ const j = it.root.userData.j; if(it.mode==='pop'){ j.p = j.pt = 1; } else { it.root.visible = true; it.root.position.y = it.y0; } }); intros.length = 0; }
  for(let i=intros.length-1;i>=0;i--){ const it = intros[i]; it.delay -= raw; if(it.delay > 0) continue; const j = it.root.userData.j;
    if(it.mode==='pop'){ j.pt = 1; intros.splice(i,1); continue; }
    if(!it.root.visible){ it.root.visible = true; it.root.position.y = it.y0 + it.h; }
    it.vy += 75*dt; it.root.position.y -= it.vy*dt;
    if(it.root.position.y <= it.y0){ it.root.position.y = it.y0; j.v -= Math.min(9, it.vy*.17); j.wv += (rnd()-.5)*3; intros.splice(i,1); } }

  /* molas: squash & stretch + escala de surgimento + balanço */
  for(const r of roots){ const j = r.userData.j;
    for(let s=0;s<steps;s++){ const a = -260*(j.s - j.t) - 13*j.v; j.v += a*h; j.s += j.v*h;
      const ap = -170*(j.p - j.pt) - 11*j.pv; j.pv += ap*h; j.p += j.pv*h;
      const aw = -120*j.w - 7*j.wv; j.wv += aw*h; j.w += j.wv*h; }
    const s = Math.max(.35, j.s), p = Math.max(0, j.p), q = 1/Math.sqrt(s);
    r.scale.set(j.base.x*p*q, j.base.y*p*s, j.base.z*p*q); r.rotation.z = j.rz + j.w*.06; }

  /* mascote pulando nos blocos */

    if(M.wait <= 0){ if(!M.q.length && !RM){ const n = M.idx < 0 ? 0 : Math.max(0, Math.min(6, M.idx + (Math.random()<.5?-1:1) * (1 + Math.floor(Math.random()*2)))); M.q.push(n); }
      if(M.q.length){ M.phase = 'anti'; M.t = 0; mj.t = .7; } else M.wait = 2; } }
  else if(M.phase==='anti'){ M.t += dt; if(M.t > .16){ M.phase = 'air'; M.t = 0; mj.t = 1; mj.v += 6; M.from.copy(M.root.position); M.idx = M.q.shift(); M.to.copy(BLOCKS[M.idx].top);
      const dx = M.to.x - M.from.x, dz = M.to.z - M.from.z; M.root.rotation.y = Math.abs(dx)+Math.abs(dz) > .01 ? Math.atan2(dx, dz) : 0; M.dur = .5 + Math.min(.4, Math.hypot(dx,dz)*.03); } }
  else if(M.phase==='air'){ M.t += dt/M.dur; const t = Math.min(1, M.t);

  /* robô de IA */
  bot.root.position.y = 7.2 + Math.sin(T*1.6)*.45; bot.body.rotation.y = Math.sin(T*.7)*.5; bot.body.rotation.z = Math.sin(T*1.1)*.08;
  bot.hands.forEach((hh,i)=>{ hh.position.y = -.25 + Math.sin(T*2.2 + i*Math.PI)*.25; });

  /* piscadas */
  for(const b of blinkers){ if(b.t < 0){ b.next -= dt; if(b.next <= 0){ b.t = 0; } } else { b.t += dt; const k = b.t < .07 ? 1 - b.t/.07 : (b.t < .16 ? (b.t-.07)/.09 : 1); b.g.forEach(e=>e.scale.y = Math.max(.08, k)*(e.userData.sy||1)); if(b.t >= .16){ b.t = -1; b.next = 1.8 + Math.random()*4; b.g.forEach(e=>e.scale.y = e.userData.sy||1); } } }

  /* pessoas do time: respiração e aceno */
  people.forEach(p=>{ const P = p.g.userData.parts, on = selKey===p.k || hoverKey===p.k;
    P.head.rotation.z = Math.sin(T*1.3 + p.ph)*.06; P.head.rotation.y = Math.sin(T*.6 + p.ph)*.2;
    P.arms[1].rotation.z = on ? 2.4 + Math.sin(T*9)*.35 : .12 + Math.sin(T*1.2+p.ph)*.04;
    P.arms[0].rotation.z = -.12 - Math.sin(T*1.2+p.ph)*.04; });

  /* linha de frente caminhando */
  walkers.forEach(w=>{ w.a += dt*sp*w.sp; w.ph += dt*sp*9; const x = Math.cos(w.a)*w.r, z = Math.sin(w.a)*w.r;
    const dirx = -Math.sin(w.a)*Math.sign(w.sp), dirz = Math.cos(w.a)*Math.sign(w.sp);
    w.g.position.set(x, Math.abs(Math.sin(w.ph))*.14, z); w.g.rotation.y = Math.atan2(dirx, dirz);
    const P = w.g.userData.parts; P.legs[0].rotation.x = Math.sin(w.ph)*.55; P.legs[1].rotation.x = -Math.sin(w.ph)*.55; P.arms[0].rotation.x = -Math.sin(w.ph)*.5; });

  /* cofrinho e moedas */
  piggy.coins.forEach(cn=>{ cn.t += dt*sp; if(cn.t < 0) return; if(cn.t < dt*sp*1.5){ cn.m.position.set(piggy.g.position.x, 16, piggy.g.position.z); cn.v = 0; }
    cn.v = (cn.v||0) + 30*dt*sp; cn.m.position.y -= cn.v*dt*sp; cn.m.rotation.y += dt*6;
    if(cn.m.position.y < 4.8){ cn.m.position.y = -50; cn.t = -2.4 - Math.random()*1.5; piggy.g.userData.j.v -= 2.6; piggy.g.userData.j.wv += 1.2; } });

  /* balões */
  balloons.forEach(b=>{ const a = b.a + T*.012; b.g.position.set(Math.cos(a)*b.r, b.h + Math.sin(T*.9 + b.ph)*.7, Math.sin(a)*b.r);
    b.env.rotation.z = Math.sin(T*1.1 + b.ph)*.08; b.card.quaternion.copy(camera.quaternion);
    /* balão perto demais da câmera esmaece para não tampar a cena */
    const near = b.k===selKey || b.k===hoverKey ? 1 : Math.min(1, Math.max(0, (b.g.position.distanceTo(camera.position) - 24)/16));
    b.env.material.opacity = near; b.card.material.opacity = near; b.g.visible = near > .03; });
  hot.g.position.y = 24 + Math.sin(T*.5)*1.1; hot.g.rotation.y = Math.sin(T*.2)*.3; hot.fl.scale.setScalar(.8 + Math.random()*.35);
  hot.ban.rotation.y = Math.atan2(camera.position.x - hot.g.position.x, camera.position.z - hot.g.position.z) - hot.g.rotation.y;
  blimp.a += dt*sp*.05; const ba = blimp.a; blimp.g.position.set(Math.cos(ba)*50, 28 + Math.sin(T*.4)*1.2, Math.sin(ba)*50); blimp.g.rotation.set(0, -ba - Math.PI/2, Math.sin(T*.6)*.04); blimp.prop.rotation.x += dt*14;
  clouds.forEach(c=>{ c.a += dt*c.sp*sp; c.g.position.set(Math.cos(c.a)*c.r, c.y + Math.sin(T*.3 + c.r)*1.2, Math.sin(c.a)*c.r); });
  smokes.forEach(s=>{ const u = (T*.35 + s.off) % 1; s.m.position.y = 5.2 + u*3.4; s.m.position.x = 1.5 + u*.7; s.m.scale.setScalar(.35 + u*1.1); s.m.material.opacity = .75*(1-u); });
  sway.forEach(s=>{ s.g.rotation.z = Math.sin(T*.9 + s.ph)*.025; });
  anims.forEach(f=>f(T));

  /* envelopes */
  packets.forEach(p=>{ if(p.t < 0){ p.t += dt*sp; if(p.t >= 0) launchPacket(p); return; } p.t += dt*sp*.42;
    if(p.t >= 1){ p.g.visible = false; const e = REG[p.target]; if(e) e.roots.forEach(r=>{ r.userData.j.v -= 2.2; }); p.t = -.6 - Math.random()*1.4; return; }
    p.curve.getPoint(p.t, p.g.position); p.curve.getTangent(p.t, tmp); p.g.lookAt(tmp.add(p.g.position)); p.g.rotateY(Math.PI/2); });

  /* confete e onda */
  confetti.forEach(c=>{ if(c.life <= 0) return; c.life -= dt; c.v.y -= 20*dt; c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += c.s.x*dt; c.m.rotation.y += c.s.y*dt; c.m.scale.setScalar(Math.min(1, c.life*2)); if(c.life <= 0 || c.m.position.y < -40) { c.life = 0; c.m.visible = false; } });
  if(rippleT < 1){ rippleT += dt*1.4; ripple.scale.setScalar(1 + rippleT*5); ripple.material.opacity = .9*(1-rippleT); } else ripple.material.opacity = 0;

  /* câmera */
  if(cam.follow && !userDrag){ cam.follow.getWorldPosition(vC); vC.y += 2; cam.tt.copy(vC).add(cam.shift); cam.pt.copy(cam.tt).add(cam.off); if(!cam.on){ cam.pos.copy(camera.position); cam.tgt.copy(controls.target); cam.pv.set(0,0,0); cam.tv.set(0,0,0); cam.on = true; } }
  if(cam.on){
    for(let s=0;s<steps;s++){
      v3.copy(cam.pt).sub(cam.pos).multiplyScalar(34).addScaledVector(cam.pv, -9.2); cam.pv.addScaledVector(v3, h); cam.pos.addScaledVector(cam.pv, h);
      v3.copy(cam.tt).sub(cam.tgt).multiplyScalar(40).addScaledVector(cam.tv, -10.5); cam.tv.addScaledVector(v3, h); cam.tgt.addScaledVector(cam.tv, h); }
    camera.position.copy(cam.pos); controls.target.copy(cam.tgt);
    if(!cam.follow && cam.pos.distanceTo(cam.pt) < .02 && cam.pv.length() < .02 && cam.tgt.distanceTo(cam.tt) < .02) cam.on = false;
  }
  if(!RM && idle > 14 && !selKey && !tour && !cam.on) controls.autoRotate = true;
  controls.update();

  /* rótulos */
  const w = innerWidth, hh = innerHeight;
  for(const l of labels){
    let hide = !l.obj.visible || (l.hoverOnly && l.key!==hoverKey && l.key!==selKey);
    if(!hide){ l.obj.getWorldPosition(v3); const d = v3.distanceTo(camera.position); v3.y += l.off*(l.obj.userData.j ? l.obj.userData.j.p : 1); v3.project(camera);
      if(v3.z > 1 || Math.abs(v3.x) > 1.15 || Math.abs(v3.y) > 1.15 || (d > l.maxD && l.key!==selKey && l.key!==hoverKey)) hide = true;
      else l.el.style.transform = 'translate3d('+((v3.x*.5+.5)*w - l.el.offsetWidth/2).toFixed(1)+'px,'+((-v3.y*.5+.5)*hh - l.el.offsetHeight - 6).toFixed(1)+'px,0)'; }
    if(hide === !l.shown) continue;
    l.shown = !hide; l.el.classList.toggle('hide', hide);
  }
  if(counter && counter.t < 1){ counter.t = Math.min(1, counter.t + dt/1.6); const e = 1 - Math.pow(1-counter.t, 4); sBig.textContent = (counter.st.pre||'')+fmt.format(Math.round(counter.st.to*e))+(counter.st.suf||''); }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.MUNDO = { camera, controls, select, goHome };
})();
</script>
</body>
</html>
